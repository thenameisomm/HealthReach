<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title desc">
  <title id="title">HealthReach four-stage workflow</title>
  <desc id="desc">Four cards: Brief, Evidence, Plan, Results. Each stage answers one question and hands evidence to the next.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#171717"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#E5E5E5"/>
<text x="60" y="72" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#171717" letter-spacing="-1.5">One guided workflow</text><text x="60" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#3D3D3D">Every stage answers one question, then hands its evidence to the next.</text>  <g>
    <rect x="55" y="150" width="250" height="270" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="55" y="150" width="250" height="8" rx="4" fill="#2563EB"/>
    <circle cx="91" cy="204" r="21" fill="#2563EB"/>
<text x="91" y="211" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="125" y="213" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#171717" letter-spacing="-0.8">Brief</text><text x="79" y="276" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Topic, place,</text><text x="79" y="308" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">budget, timing</text>    <line x1="79" y1="340" x2="281" y2="340" stroke="#C6C6C6" stroke-width="1"/>
<text x="79" y="380" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#2563EB">What are we planning?</text>  </g>
  <line x1="309" y1="285" x2="331" y2="285" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="335" y="150" width="250" height="270" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="335" y="150" width="250" height="8" rx="4" fill="#4F46E5"/>
    <circle cx="371" cy="204" r="21" fill="#4F46E5"/>
<text x="371" y="211" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text><text x="405" y="213" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#171717" letter-spacing="-0.8">Evidence</text><text x="359" y="276" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Cultural hints +</text><text x="359" y="308" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">nearby places</text>    <line x1="359" y1="340" x2="561" y2="340" stroke="#C6C6C6" stroke-width="1"/>
<text x="359" y="380" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#4F46E5">What do we know?</text>  </g>
  <line x1="589" y1="285" x2="611" y2="285" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="615" y="150" width="250" height="270" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="615" y="150" width="250" height="8" rx="4" fill="#8B5CF6"/>
    <circle cx="651" cy="204" r="21" fill="#8B5CF6"/>
<text x="651" y="211" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="685" y="213" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#171717" letter-spacing="-0.8">Plan</text><text x="639" y="276" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Activities, venues,</text><text x="639" y="308" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">exact budget</text>    <line x1="639" y1="340" x2="841" y2="340" stroke="#C6C6C6" stroke-width="1"/>
<text x="639" y="380" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#8B5CF6">What should we do?</text>  </g>
  <line x1="869" y1="285" x2="891" y2="285" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="895" y="150" width="250" height="270" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="895" y="150" width="250" height="8" rx="4" fill="#10B981"/>
    <circle cx="931" cy="204" r="21" fill="#10B981"/>
<text x="931" y="211" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text><text x="965" y="213" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#171717" letter-spacing="-0.8">Results</text><text x="919" y="276" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Aggregate counts</text><text x="919" y="308" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">only</text>    <line x1="919" y1="340" x2="1121" y2="340" stroke="#C6C6C6" stroke-width="1"/>
<text x="919" y="380" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#10B981">What happened?</text>  </g>
<text x="60" y="460" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5F5F5F">No dashboards. No accounts. Just the next right step.</text></svg>
