<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
  <title id="title">HealthReach architecture</title>
  <desc id="desc">A small monorepo: Next.js web app, FastAPI service, optional MongoDB, and external adapters that fail honestly.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#171717"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#E5E5E5"/>
<text x="60" y="72" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#171717" letter-spacing="-1.5">Small monorepo. Clear edges.</text><text x="60" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#3D3D3D">Four guided routes, two apps, and adapters that fail honestly.</text>  <g>
    <rect x="60" y="160" width="330" height="270" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="60" y="160" width="330" height="7" rx="3.5" fill="#2563EB"/>
<text x="86" y="204" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5F5F5F" letter-spacing="2">WEB</text><text x="86" y="248" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#171717" letter-spacing="-1">Next.js 14</text><text x="86" y="298" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">Four guided routes</text><text x="86" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">Typed API client</text><text x="86" y="366" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">Leaflet + charts</text>  </g>
  <line x1="394" y1="294" x2="431" y2="294" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="435" y="160" width="330" height="270" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="435" y="160" width="330" height="7" rx="3.5" fill="#8B5CF6"/>
<text x="461" y="204" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5F5F5F" letter-spacing="2">API</text><text x="461" y="248" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#171717" letter-spacing="-1">FastAPI</text><text x="461" y="298" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">Qloo + OSM adapters</text><text x="461" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">Deterministic planner</text><text x="461" y="366" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">LLM repair + fallback</text>  </g>
  <line x1="769" y1="294" x2="806" y2="294" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="810" y="160" width="330" height="270" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="810" y="160" width="330" height="7" rx="3.5" fill="#10B981"/>
<text x="836" y="204" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5F5F5F" letter-spacing="2">DATA</text><text x="836" y="248" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#171717" letter-spacing="-1">MongoDB</text><text x="836" y="298" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">In-memory fallback</text><text x="836" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">Versioned plans</text><text x="836" y="366" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#3D3D3D">Aggregate results only</text>  </g>
<text x="60" y="486" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5F5F5F" letter-spacing="1.8">DEPENDENCIES — EACH FAILS HONESTLY</text>  <rect x="60" y="508" width="255" height="54" rx="14" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
  <circle cx="82" cy="535" r="5" fill="#4F46E5"/>
<text x="98" y="542" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#171717">Qloo · cultural hints</text>  <rect x="335" y="508" width="255" height="54" rx="14" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
  <circle cx="357" cy="535" r="5" fill="#10B981"/>
<text x="373" y="542" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#171717">OSM · nearby places</text>  <rect x="610" y="508" width="255" height="54" rx="14" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
  <circle cx="632" cy="535" r="5" fill="#8B5CF6"/>
<text x="648" y="542" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#171717">LLM · plan drafts</text>  <rect x="885" y="508" width="255" height="54" rx="14" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
  <circle cx="907" cy="535" r="5" fill="#2563EB"/>
<text x="923" y="542" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#171717">Mongo · persistence</text><text x="60" y="600" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5F5F5F">No accounts. No patient data. No raw provider payloads.</text></svg>
