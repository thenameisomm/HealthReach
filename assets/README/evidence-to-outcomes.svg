    <rect x="895" y="150" width="250" height="8" rx="4" fill="#5F5F5F"/>
<text x="919" y="202" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#171717" letter-spacing="-0.8">Comparison</text><text x="919" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Descriptive,</text><text x="919" y="290" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">never causal</text>    <line x1="919" y1="320" x2="1121" y2="320" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="919" y="340" width="176" height="28" rx="14.0" fill="#FFFFFF" stroke="#5F5F5F" stroke-width="1.5"/><text x="933" y="359.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#171717">DERIVED</text>
  </g>
<text x="60" y="430" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5F5F5F">Cultural relevance is not trust. Candidate places still need a visit.</text></svg>
