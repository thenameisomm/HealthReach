<text x="79" y="202" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#171717" letter-spacing="-0.8">Evidence</text><text x="79" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Qloo hints +</text><text x="79" y="290" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">OSM places</text>    <line x1="79" y1="320" x2="281" y2="320" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="79" y="340" width="176" height="28" rx="14.0" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="93" y="359.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#171717">QLOO · GEO</text>
  </g>
  <line x1="309" y1="270" x2="331" y2="270" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="335" y="150" width="250" height="240" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="335" y="150" width="250" height="8" rx="4" fill="#8B5CF6"/>
<text x="359" y="202" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#171717" letter-spacing="-0.8">Plan</text><text x="359" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Activities, venues,</text><text x="359" y="290" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">exact budget</text>    <line x1="359" y1="320" x2="561" y2="320" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="359" y="340" width="176" height="28" rx="14.0" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/><text x="373" y="359.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#171717">AI · ESTIMATE</text>
  </g>
