<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="title desc">
  <title id="title">From evidence to outcomes</title>
  <desc id="desc">Provenance travels from evidence to plan, results, and a descriptive comparison. Cultural relevance is not trust.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#171717"/>
    </marker>
  </defs>
  <rect width="1200" height="450" fill="#E5E5E5"/>
<text x="60" y="72" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#171717" letter-spacing="-1.5">From evidence to outcomes</text><text x="60" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#3D3D3D">Provenance travels from evidence to the final comparison.</text>  <g>
    <rect x="55" y="150" width="250" height="240" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
