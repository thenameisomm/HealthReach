<text x="639" y="202" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#171717" letter-spacing="-0.8">Results</text><text x="639" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Registrations,</text><text x="639" y="290" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">attendance, spend</text>    <line x1="639" y1="320" x2="841" y2="320" stroke="#C6C6C6" stroke-width="1"/>
    <rect x="639" y="340" width="176" height="28" rx="14.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="653" y="359.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#171717">USER · ACTUAL</text>
