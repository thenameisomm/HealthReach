<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
  <title id="title">HealthReach AI — Plan community health outreach people actually attend</title>
  <desc id="desc">Editorial hero: plan outreach with local cultural hints, nearby candidate places, an inspectable plan, and honest results.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#171717"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#E5E5E5"/>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#171717" opacity="0.18"/>
    </pattern>
  </defs>
  <rect x="660" y="0" width="540" height="620" fill="url(#dots)" opacity="0.55"/>

  <rect x="72" y="72" width="58" height="7" rx="3.5" fill="#FFF100"/>
  <text x="72" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5F5F5F" letter-spacing="2.4">COMMUNITY HEALTH OUTREACH PLANNER</text>

  <text x="72" y="208" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#171717" letter-spacing="-3">Plan outreach</text>
  <text x="72" y="296" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#171717" letter-spacing="-3">people actually</text>
  <rect x="66" y="324" width="330" height="68" rx="5" fill="#D1FFCA"/>
  <text x="72" y="384" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#171717" letter-spacing="-3">attend.</text>

  <text x="72" y="448" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#3D3D3D">Local culture, nearby places, and an inspectable</text>
  <text x="72" y="482" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#3D3D3D">plan. Then a clear-eyed look at what happened.</text>

  <rect x="72" y="522" width="108" height="36" rx="18.0" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1.5"/><text x="86" y="545.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#171717">Brief</text>
  <rect x="192" y="522" width="138" height="36" rx="18.0" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="206" y="545.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#171717">Evidence</text>
  <rect x="342" y="522" width="100" height="36" rx="18.0" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/><text x="356" y="545.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#171717">Plan</text>
  <rect x="454" y="522" width="122" height="36" rx="18.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="468" y="545.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#171717">Results</text>

  <text x="72" y="592" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#5F5F5F">Every number carries its source.</text>

  <rect x="770" y="120" width="360" height="430" rx="26" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
  <rect x="770" y="120" width="9" height="430" rx="4.5" fill="#D1FFCA"/>
  <rect x="1094" y="142" width="16" height="56" rx="8" fill="#FFF100"/>

  <text x="800" y="166" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5F5F5F" letter-spacing="1.8">CAMPAIGN SNAPSHOT</text>
  <text x="800" y="222" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#171717" letter-spacing="-1">East Austin</text>
  <text x="800" y="262" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#171717" letter-spacing="-1">screening camp</text>
  <line x1="800" y1="292" x2="1100" y2="292" stroke="#C6C6C6" stroke-width="1"/>

  <circle cx="806" cy="326" r="5" fill="#2563EB"/>
  <text x="824" y="333" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#5F5F5F">Budget</text>
  <text x="1100" y="333" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#171717" text-anchor="end">$5,000</text>

  <circle cx="806" cy="371" r="5" fill="#4F46E5"/>
  <text x="824" y="378" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#5F5F5F">Evidence</text>
  <text x="1100" y="378" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#171717" text-anchor="end">Qloo + 8 places</text>

  <circle cx="806" cy="416" r="5" fill="#8B5CF6"/>
  <text x="824" y="423" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#5F5F5F">Plan</text>
  <text x="1100" y="423" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#171717" text-anchor="end">12 activities</text>

  <circle cx="806" cy="461" r="5" fill="#2563EB"/>
  <text x="824" y="468" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#5F5F5F">Result</text>
  <text x="1100" y="468" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#171717" text-anchor="end">180 registered</text>

  <rect x="800" y="500" width="178" height="30" rx="15.0" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1.5"/><text x="814" y="520.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#171717">Illustrative demo</text>
