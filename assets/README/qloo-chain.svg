<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Qloo three-step agent chain</title>
  <desc id="desc">Three linked questions: place affinities, taste tags from the top place, then a cross-check with a second place.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#171717"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#E5E5E5"/>
<text x="60" y="72" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#171717" letter-spacing="-1.5">Three linked questions</text><text x="60" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#3D3D3D">A deterministic Qloo chain, not an LLM guessing at culture.</text>  <g>
    <rect x="60" y="155" width="340" height="240" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <circle cx="98" cy="198" r="22" fill="#4F46E5"/>
<text x="98" y="205" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="134" y="207" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#171717" letter-spacing="-0.8">Place affinities</text><text x="88" y="272" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">What feels local</text><text x="88" y="304" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">near the campaign?</text>    <line x1="88" y1="334" x2="372" y2="334" stroke="#C6C6C6" stroke-width="1"/>
<text x="88" y="369" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#4F46E5">Seeds the next question</text>  </g>
  <line x1="404" y1="275" x2="426" y2="275" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="430" y="155" width="340" height="240" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <circle cx="468" cy="198" r="22" fill="#8B5CF6"/>
<text x="468" y="205" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text><text x="504" y="207" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#171717" letter-spacing="-0.8">Taste tags</text><text x="458" y="272" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">What else do fans</text><text x="458" y="304" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">of that place like?</text>    <line x1="458" y1="334" x2="742" y2="334" stroke="#C6C6C6" stroke-width="1"/>
<text x="458" y="369" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8B5CF6">Adds cultural texture</text>  </g>
  <line x1="774" y1="275" x2="796" y2="275" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="800" y="155" width="340" height="240" rx="22" fill="#FFFFFF" stroke="#C6C6C6" stroke-width="1"/>
    <circle cx="838" cy="198" r="22" fill="#10B981"/>
<text x="838" y="205" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="874" y="207" font-family="'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#171717" letter-spacing="-0.8">Cross-check</text><text x="828" y="272" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">Does a second</text><text x="828" y="304" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3D3D3D">place agree?</text>    <line x1="828" y1="334" x2="1112" y2="334" stroke="#C6C6C6" stroke-width="1"/>
<text x="828" y="369" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#10B981">Records a skip reason</text>  </g>
<text x="60" y="445" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5F5F5F">If a step has nothing useful to add, it says so — it never invents a result.</text></svg>
